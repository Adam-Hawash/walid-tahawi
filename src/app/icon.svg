<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- فافيكون «الشكل الكيميائي» — حلقة بنزين عطرية + ذرتين مرتبطتين -->
  <!-- خلفية مربعة ناعمة الزوايا (rx ≈ 22%) بلون فاتح كي تتضح على تابات المتصفح الغامقة -->
  <rect x="3" y="3" width="58" height="58" rx="13" fill="#f0fdfa"/>

  <!-- رابطتين قصيرتين من رأسي السداسي العلوي (خطوط مدورة) -->
  <g stroke="#0f766e" stroke-width="4.5" stroke-linecap="round">
    <line x1="17.71" y1="24.75" x2="12.9" y2="21.95"/>
    <line x1="46.29" y1="24.75" x2="51.1" y2="21.95"/>
  </g>

  <!-- عقدتا ذرتين مرتبطتين (زمرد) -->
  <circle cx="11.3" cy="21" r="4" fill="#10b981"/>
  <circle cx="52.7" cy="21" r="4" fill="#10b981"/>

  <!-- حلقة سداسية (بنزين) — خط سميك مدور الزوايا -->
  <path d="M32 16.5 L46.29 24.75 L46.29 41.25 L32 49.5 L17.71 41.25 L17.71 24.75 Z"
        fill="none" stroke="#0f766e" stroke-width="5" stroke-linejoin="round"/>

  <!-- الدائرة الداخلية = الحلقة العطرية -->
  <circle cx="32" cy="33" r="7" fill="none" stroke="#0f766e" stroke-width="3.5"/>
</svg>
